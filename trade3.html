<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNQ Trading Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black p-4 md:p-8" id="body">
    <button onclick="changeFont(2)" class="bg-blue-900 text-white p-2 rounded">Increase Text Size</button>
    
    <h1 class="text-3xl font-bold mt-4">MNQ Trading Plan: 10AM - 12PM</h1>
    
    <div class="mt-6">
        <label>Enter 10AM Price: </label>
        <input type="number" id="startPrice" class="border p-2" value="22000">
        <button onclick="simulate()" class="bg-black text-white p-2 ml-2">Simulate What-If</button>
    </div>

    <table class="w-full mt-6 border-collapse border border-black">
        <thead><tr class="bg-blue-100"><th>Scenario</th><th>Target Price</th><th>Goal</th></tr></thead>
        <tbody id="simBody"></tbody>
    </table>

    <script>
        function simulate() {
            let p = parseFloat(document.getElementById('startPrice').value);
            let body = document.getElementById('simBody');
            body.innerHTML = `
                <tr><td class="border p-2">Buy (Long) +10 pts</td><td class="border p-2">${p + 10}</td><td class="border p-2 text-green-600">+$20</td></tr>
                <tr><td class="border p-2">Sell (Short) -10 pts</td><td class="border p-2">${p - 10}</td><td class="border p-2 text-green-600">+$20</td></tr>
            `;
        }
        function changeFont(n) {
            let body = document.getElementById('body');
            let size = parseInt(window.getComputedStyle(body).fontSize);
            body.style.fontSize = (size + n) + "px";
        }
    </script>
</body>
</html>
